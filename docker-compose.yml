version: '3.8'

services:
  motel-bot:
    build: .
    container_name: motel-intensy-bot
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./sessions:/app/tokens
      - ./temp:/app/temp
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Motel Intensy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen">
    <div class="bg-gray-900 p-8 rounded-3xl border border-gray-800 shadow-2xl w-full max-w-md">
        <h1 class="text-3xl font-bold text-pink-500 mb-8 text-center uppercase tracking-widest">Acesso Restrito</h1>
        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label class="block text-gray-400 text-sm mb-2">Usuário</label>
                <input type="text" name="username" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
            </div>
            <div>
                <label class="block text-gray-400 text-sm mb-2">Senha</label>
                <input type="password" name="password" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
            </div>
            <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-pink-600/20">Entrar no Painel</button>
        </form>
    </div>
</body>
</html>
